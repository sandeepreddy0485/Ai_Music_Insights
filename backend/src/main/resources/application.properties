# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=music-catalog-api

# Active Spring Profile (dev uses H2 in-memory DB for quick setup, prod uses PostgreSQL)
spring.profiles.active=dev

# Common JPA Settings
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=9a2f8c4e7b1d3f6a8c0e2b4d6f8a0c2e4f6b8d0a2c4e6f8a0c2e4f6b8d0a2c4e
jwt.expiration.ms=86400000

# iTunes API Configuration
itunes.api.url=https://itunes.apple.com/search

# Logging Configuration
logging.level.root=INFO
logging.level.com.musiccatalog.api=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
